<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self';">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ERG Viewer</title>
    <style>
      :root{
        --bg:#FAF7F2;--fg:#2F2A26;--muted:#6B5F57;
        --header-bg:rgba(255,250,243,.85);
        --card-bg:#FFF9F1;--border:#E8E1D9;
        --btn-bg:#F5EFE6;--btn-bg-hover:#EDE4D9;--btn-fg:#2F2A26;
        --primary:#8BB9F1;--primary-hover:#79A7E5;--primary-fg:#163052;
        --chip-bg:#F3ECE3;
        --plot-bg:rgba(0,0,0,0);
        --overlay-bg:rgba(255,245,230,.9);--overlay-border:#E8D8C2;--overlay-fg:#8B5E2B;
        --magnifier-bg:#FFF9F1;--magnifier-border:#E8E1D9;--magnifier-fg:#2F2A26;
        --select-bg:#FFF7EC;
        --toast-bg:rgba(255,245,230,.9);--toast-fg:#2F2A26;--toast-border:#E8D8C2;
        --axis:#6B5F57;--grid:#E8E1D9;--spike:#6B5F57;--hoverlabel-bg:#FFF7EC;--hoverlabel-fg:#2F2A26;
        --line-right:#D97C5A;--line-left:#5B8FB9;
      }
      *{box-sizing:border-box}
      html,body,#root{height:100%;margin:0}
      body{
        font-family:system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
        background:
          linear-gradient(135deg, rgba(139,185,241,.12), rgba(107,212,168,.07) 38%, rgba(244,167,160,.08) 72%, rgba(242,193,78,.08)),
          var(--bg);
        color:var(--fg);
        font-size:13px;
        letter-spacing:0;
        line-height:1.25;
      }
      .app{display:flex;flex-direction:column;height:100%}
      header{position:sticky;top:0;z-index:20;backdrop-filter:saturate(180%) blur(14px);background:var(--header-bg);border-bottom:1px solid var(--border)}
      .hx{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 14px;min-height:52px}
      .title{font-size:18px;font-weight:700;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
      .ecg{width:60px;height:16px;display:inline-block}
      .ecg path{fill:none;stroke:var(--primary);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:120;animation:ecg-dash 1.8s linear infinite}
      @keyframes ecg-dash{from{stroke-dashoffset:120}to{stroke-dashoffset:0}}
      .actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;min-width:0}
      .actions button{width:62px;height:32px;padding:0 8px;border-radius:8px;border:1px solid var(--border);background:var(--btn-bg);color:var(--btn-fg);cursor:pointer;transition:transform .15s ease,background .2s,border-color .2s;white-space:nowrap;font-size:12px;overflow:hidden;text-overflow:ellipsis}
      .actions button:hover{transform:translateY(-1px);background:var(--btn-bg-hover);border-color:var(--primary)}
      .primary{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
      .primary:hover{background:var(--primary-hover)}
      .lang-select{appearance:none;-webkit-appearance:none;width:58px;height:32px;padding:0 8px;border:1px solid var(--border);border-radius:8px;background:var(--select-bg);background-image:none;color:var(--fg);font-size:12px;font-weight:650;text-align:center;text-align-last:center;cursor:pointer}
      .lang-select::-ms-expand{display:none}
      .lang-select:focus{outline:none;border-color:var(--primary)}
      main{flex:1;min-height:0;display:flex;align-items:stretch;gap:12px;padding:12px;overflow:hidden}
      .left{width:300px;min-width:280px;height:100%;display:flex;flex-direction:column;gap:12px;overflow:auto;padding-bottom:2px;scrollbar-width:none;-ms-overflow-style:none}
      .left::-webkit-scrollbar{width:0;height:0;display:none}
      .card{background:var(--card-bg);border:1px solid var(--border);border-radius:8px;padding:11px;box-shadow:0 8px 20px rgba(40,52,70,.08)}
      .card h3{margin:0 0 8px;font-size:13px;font-weight:700;opacity:.92}
      .kv{display:grid;grid-template-columns:90px 1fr;gap:6px;font-size:12px}
      .kv div{opacity:.9;min-width:0;overflow-wrap:anywhere}
      .center{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;gap:12px;overflow:auto;padding-bottom:2px;scrollbar-width:none;-ms-overflow-style:none}
      .center::-webkit-scrollbar{width:0;height:0;display:none}
      .group-nav{display:flex;align-items:center;gap:8px}
      .group-nav button{width:58px;min-height:58px;padding:0 8px;border-radius:8px;border:1px solid var(--border);background:var(--btn-bg);color:var(--btn-fg);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      /* Ensure group label and dropdown align in width and typography */
      .group-nav .chip{display:block;box-sizing:border-box;padding:6px 16px}
      .group-nav .select{box-sizing:border-box}
      .plots{display:grid;grid-template-columns:1fr 1fr;gap:12px}
      .two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
      .grid3{display:grid;grid-template-columns:86px minmax(0,1fr) minmax(0,1fr);gap:6px;font-size:12px;justify-items:center;text-align:center}
      .grid3 > div{min-width:0;overflow-wrap:anywhere}
      .grid3 .head{font-weight:600;opacity:.9;font-size:14px}
      .ops-grid{display:grid;grid-template-columns:max-content repeat(5,minmax(0,1fr));gap:6px;align-items:center;font-size:12px}
      .ops-grid .head{font-weight:600;opacity:.9}
      .ops-row{display:grid;grid-template-columns:1fr 40px;gap:8px;align-items:stretch;margin-top:8px}
      .ops-compute{width:40px;height:100%;padding:4px 6px;font-size:12px}
      /* Ops cell hover overlay for 清空/重标 */
      .ops-cell{position:relative;display:flex;align-items:center;justify-content:center}
      .ops-hover{position:absolute;left:50%;top:0;transform:translate(-50%, -110%);display:flex;gap:6px;background:var(--overlay-bg);border:1px solid var(--overlay-border);border-radius:8px;padding:4px 6px;z-index:10;box-shadow:0 8px 18px rgba(40,52,70,.16)}
      .btn-mini{padding:4px 8px;border-radius:8px;border:1px solid var(--border);background:var(--btn-bg);color:var(--btn-fg);cursor:pointer;font-size:12px;white-space:nowrap;min-width:44px;display:inline-flex;align-items:center;justify-content:center}
      .btn-mini:hover{background:var(--btn-bg-hover)}
      .plot-card{display:flex;flex-direction:column;gap:8px;min-width:0}
      .titlebar{height:20px;display:flex;justify-content:center;align-items:center;gap:8px;font-size:13px;font-weight:600}
      .titlebar > div{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
      .plot-wrap{position:relative}
      .plot{height:322px;border-radius:8px;overflow:hidden;background:var(--plot-bg);border:1px solid var(--border)}
      .annot-overlay{position:absolute;right:8px;top:8px;background:var(--overlay-bg);border:1px solid var(--overlay-border);border-radius:8px;padding:4px 8px;font-size:12px;color:var(--overlay-fg);pointer-events:none}
      .magnifier{position:fixed;left:16px;top:100px;width:280px;background:var(--magnifier-bg);border:1px solid var(--magnifier-border);border-radius:8px;box-shadow:0 12px 28px rgba(40,52,70,.18);z-index:50}
      .magnifier-header{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;font-size:12px;color:var(--magnifier-fg);border-bottom:1px solid var(--magnifier-border)}
      .magnifier-body{padding:6px}
      .magnifier-plot{height:160px;border-radius:8px;overflow:hidden;background:var(--plot-bg);border:1px solid var(--border)}
      .controls{display:flex;gap:8px;align-items:center;min-height:32px}
      .axis-controls{display:grid;grid-template-columns:minmax(0,1fr) 76px minmax(0,1fr);gap:8px;align-items:center}
      .axis-group{display:grid;grid-template-columns:96px 32px 32px;gap:6px;align-items:center;min-width:0}
      .axis-group.axis-max{justify-content:end}
      .axis-chip{height:32px;display:flex;align-items:center;justify-content:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
      .axis-btn{width:32px;height:32px;padding:0}
      .step-box{display:flex;align-items:center;justify-content:center;min-width:0}
      .step-select{width:76px;height:32px;padding:0 18px 0 8px}
      .export-controls{display:grid;grid-template-columns:62px minmax(0,1fr) auto;align-items:center}
      .controls .export{display:grid;grid-template-columns:repeat(5,56px);gap:6px;white-space:nowrap}
      .controls .export .btn{width:56px;padding-left:4px;padding-right:4px;overflow:hidden;text-overflow:ellipsis}
      .select{appearance:none;-webkit-appearance:none;background:var(--select-bg);border:1px solid var(--border);color:var(--fg);border-radius:8px;padding:0 16px;position:relative;text-align:center;text-align-last:center;font-size:12px;min-height:32px}
      .select option{text-align:center}
      .select:focus{outline:none;border-color:var(--primary)}
      .select::-ms-expand{display:none}
      .marks{font-size:12px;text-align:center;justify-items:center}
      .chip{padding:4px 8px;border-radius:8px;background:var(--chip-bg);border:1px solid var(--border);font-size:12px}
      .btn{height:32px;min-height:32px;padding:0 10px;border-radius:8px;border:1px solid var(--border);background:var(--btn-bg);color:var(--btn-fg);cursor:pointer;white-space:nowrap}
      .btn:hover{background:var(--btn-bg-hover);border-color:var(--primary)}
      .btn-sm{height:30px;min-height:30px;padding:0 8px;font-size:12px}
      .label-sm{font-size:12px;display:flex;align-items:center;justify-content:center;width:100%;text-align:center}
      .ops-grid .label-sm{width:auto}
      .warn{color:#f59e0b}
      .green{color:#10b981}
      .muted{opacity:.8}
      .marks{display:grid;grid-template-columns:1fr 1fr;gap:6px}
      .row{display:flex;align-items:center;gap:8px}
      .row input{width:80px;padding:4px 6px;border-radius:8px;border:1px solid var(--border);background:var(--select-bg);color:var(--fg)}
      .annot-ctrls{display:grid;grid-template-columns:1fr 1fr;gap:12px}
      .plot-toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--toast-bg);color:var(--toast-fg);padding:10px 14px;border-radius:10px;font-size:16px;z-index:10;pointer-events:none;white-space:nowrap;border:1px solid var(--toast-border)}

      /* Theme chooser modal */
      .modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;z-index:80}
      .modal{width:280px;max-width:90vw;background:var(--card-bg);border:1px solid var(--border);border-radius:8px;box-shadow:0 18px 40px rgba(0,0,0,.18);font-size:12px}
      .modal-header{display:flex;align-items:center;justify-content:center;padding:8px 10px;border-bottom:1px solid var(--border)}
      .modal-title{font-size:14px;font-weight:600}
      .modal-body{padding:10px 12px}
      .modal-footer{display:flex;justify-content:center;gap:8px;padding:8px 12px;border-top:1px solid var(--border)}
      .theme-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;align-items:center}
      .theme-grid > *{justify-self:center}
      .theme-grid > div:nth-child(3n+1){text-align:center}
      .swatch{height:24px;width:80%;border-radius:8px;border:1px solid var(--border)}
      .radio{margin:0 auto}
      .radio{appearance:none;width:16px;height:16px;border-radius:50%;border:2px solid var(--border);display:inline-block;position:relative;cursor:pointer}
      .radio:checked{border-color:var(--primary)}
      .radio:checked::after{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:8px;height:8px;border-radius:50%;background:var(--primary)}
      /* (removed) resize mask no longer used */
    </style>
  </head>
  <body>
    <div id="root" class="app"></div>
    <script src="../../node_modules/react/umd/react.production.min.js"></script>
    <script src="../../node_modules/react-dom/umd/react-dom.production.min.js"></script>
    <script src="../../node_modules/plotly.js-dist-min/plotly.min.js"></script>
    <script src="../../node_modules/xlsx/dist/xlsx.full.min.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
