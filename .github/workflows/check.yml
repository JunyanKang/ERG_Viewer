name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install cnpm
        run: npm install -g cnpm --registry=https://registry.npmmirror.com

      - name: Install dependencies
        run: cnpm install

      - name: Run checks
        run: cnpm run check
